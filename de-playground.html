<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>桌面环境体验场 · DE Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --disp: "Chakra Petch", "PingFang SC", "Microsoft YaHei", sans-serif;
        --body: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
        --bg: #0a0d12;
        --ink: #dfe6ee;
        --dim: #8b98a8;
        --line: #222b37;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        overflow: hidden;
        font-size: 14px;
      }
      kbd {
        font-family: var(--mono);
        font-size: 0.82em;
        background: #1a212b;
        border: 1px solid #33405177;
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 6px;
        color: #bcd0e6;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: #33405188;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ============ 显示管理器（选择界面） ============ */
      #dm {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .dm-bg {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(0deg, transparent 0 3px, #ffffff05 3px 4px),
          radial-gradient(1000px 600px at 78% 18%, #16324a55, transparent 65%),
          radial-gradient(800px 500px at 12% 85%, #0e3a2f44, transparent 60%),
          linear-gradient(155deg, #0c1118, #090c11 55%, #0b1017);
      }
      .dm-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(#ffffff04 1px, transparent 1px),
          linear-gradient(90deg, #ffffff04 1px, transparent 1px);
        background-size: 44px 44px;
        mask: radial-gradient(120% 90% at 50% 40%, #000 40%, transparent 90%);
        animation: gridDrift 40s linear infinite;
      }
      @keyframes gridDrift {
        to {
          background-position:
            44px 88px,
            88px 44px;
        }
      }
      .dm-top,
      .dm-foot {
        position: relative;
        display: flex;
        justify-content: space-between;
        padding: 12px 26px;
        font-family: var(--mono);
        font-size: 12px;
        color: #5f7186;
      }
      .dm-top b {
        color: #8fb7df;
        font-weight: 400;
      }
      .dm-main {
        position: relative;
        flex: 1;
        display: grid;
        grid-template-columns: minmax(360px, 460px) 1fr;
        gap: 40px;
        padding: 8px 56px 20px;
        min-height: 0;
      }
      .dm-left {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .dm-bigclock {
        font-family: var(--disp);
        font-weight: 700;
        font-size: clamp(56px, 7vw, 88px);
        line-height: 1;
        letter-spacing: 2px;
        color: #eaf2fb;
        text-shadow: 0 0 34px #3d8ecf33;
      }
      .dm-bigclock small {
        font-size: 0.42em;
        color: #7d93ab;
        font-weight: 600;
        margin-left: 12px;
        letter-spacing: 3px;
      }
      #bigDate {
        font-family: var(--mono);
        color: #71889f;
        font-size: 13px;
        margin: 8px 0 22px;
      }
      .dm-title {
        font-family: var(--disp);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .dm-title em {
        font-style: normal;
        color: #57b6ff;
      }
      .dm-sub {
        color: #7c8ea1;
        font-size: 13px;
        margin: 6px 0 16px;
      }
      #sessList {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0d121999;
        backdrop-filter: blur(4px);
        padding: 6px;
      }
      .si {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .si:hover {
        background: #16202c;
      }
      .si.on {
        background: #14233488;
        border-left-color: var(--a);
        transform: translateX(3px);
      }
      .si-ic {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 13px;
        color: #0b0e12;
        background: var(--a);
        flex: none;
        box-shadow: 0 0 16px -4px var(--a);
      }
      .si-tx {
        flex: 1;
        min-width: 0;
      }
      .si-tx b {
        display: block;
        font-family: var(--disp);
        letter-spacing: 0.5px;
        font-size: 15px;
      }
      .si-tx span {
        font-size: 12px;
        color: #7c8ea1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }
      .si-tag {
        font-family: var(--mono);
        font-size: 10px;
        color: #6f8299;
        border: 1px solid #2a3644;
        border-radius: 4px;
        padding: 2px 6px;
        flex: none;
      }
      .dm-right {
        display: flex;
        align-items: center;
        min-height: 0;
      }
      #dmDetail {
        width: 100%;
        max-width: 640px;
        max-height: 100%;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(170deg, #0e141c, #0b0f15);
        padding: 26px 30px;
        box-shadow: 0 30px 80px -30px #000;
      }
      .d-badge {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--a);
        border: 1px solid color-mix(in srgb, var(--a) 45%, transparent);
        border-radius: 4px;
        padding: 3px 8px;
        letter-spacing: 1px;
      }
      #dmDetail h2 {
        font-family: var(--disp);
        font-size: clamp(30px, 3.4vw, 44px);
        letter-spacing: 1px;
        margin: 12px 0 2px;
      }
      .d-cn {
        color: #8fa2b6;
        font-size: 14px;
      }
      .pv {
        position: relative;
        height: 170px;
        border-radius: 10px;
        overflow: hidden;
        margin: 18px 0;
        border: 1px solid #223041;
        box-shadow: inset 0 0 60px #0007;
      }
      .pv-bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 12px;
        background: #00000072;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
      }
      .pv-bar.t {
        top: 0;
      }
      .pv-bar.b {
        bottom: 0;
      }
      .pv-bar i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--a);
      }
      .pv-w {
        position: absolute;
        border-radius: 4px;
        background: #ffffff14;
        border: 1px solid #ffffff30;
        box-shadow: 0 8px 20px #0006;
        animation: pvFloat 4s ease-in-out infinite;
      }
      .pv-w.f {
        border-color: var(--a);
        background: #ffffff1f;
      }
      @keyframes pvFloat {
        50% {
          transform: translateY(-4px);
        }
      }
      .pv-tile {
        position: absolute;
        background: #ffffff10;
        border: 1.5px solid #ffffff28;
        border-radius: 2px;
      }
      .pv-tile.f {
        border-color: var(--a);
      }
      .pv-cur {
        position: absolute;
        width: 6px;
        height: 10px;
        background: var(--a);
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .d-desc {
        color: #aebccb;
        font-size: 13.5px;
        line-height: 1.75;
        margin-bottom: 16px;
      }
      .d-facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 26px;
        margin-bottom: 16px;
      }
      .d-facts div {
        display: flex;
        gap: 10px;
        font-size: 12.5px;
        border-bottom: 1px dashed #1f2a37;
        padding: 5px 0;
      }
      .d-facts dt {
        color: #68798d;
        font-family: var(--mono);
        flex: none;
        width: 64px;
      }
      .d-facts dd {
        color: #c3d0dd;
      }
      .d-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .d-keys span {
        font-size: 12px;
        color: #93a5b8;
        background: #131b25;
        border: 1px solid #243141;
        border-radius: 6px;
        padding: 4px 9px;
      }
      .login {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        justify-content: center;
        font-family: var(--disp);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #081018;
        background: var(--a);
        border: none;
        border-radius: 9px;
        padding: 13px;
        transition:
          filter 0.15s,
          transform 0.15s;
        box-shadow: 0 10px 30px -10px var(--a);
      }
      .login:hover {
        filter: brightness(1.12);
        transform: translateY(-2px);
      }
      .dm-foot {
        border-top: 1px solid #16202b;
        background: #090d12aa;
      }
      #bootlog {
        color: #4f7d5f;
      }

      /* ============ 会话通用 ============ */
      #session {
        position: fixed;
        inset: 0;
        display: none;
      }
      #session.on {
        display: block;
      }
      .wp {
        position: absolute;
        inset: 0;
        background-size: 130% 130%;
        animation: wpDrift 46s ease-in-out infinite alternate;
      }
      @keyframes wpDrift {
        to {
          background-position: 70% 60%;
        }
      }
      .work {
        position: absolute;
        overflow: hidden;
      }
      .chips {
        position: absolute;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 1000;
      }
      .chip {
        font-family: var(--mono);
        font-size: 12px;
        color: #cfd9e4;
        background: #000000a6;
        border: 1px solid #ffffff26;
        border-radius: 20px;
        padding: 6px 13px;
        backdrop-filter: blur(6px);
        transition:
          background 0.15s,
          transform 0.15s;
      }
      .chip:hover {
        background: #000000e0;
        transform: translateY(-1px);
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 86px;
        transform: translateX(-50%);
        background: #000c;
        color: #e8eef5;
        border: 1px solid #ffffff2c;
        border-radius: 8px;
        padding: 9px 18px;
        font-size: 13px;
        z-index: 1300;
        animation: toastIn 0.2s ease-out;
        pointer-events: none;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, 8px);
        }
      }
      .intro {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #00000088;
        z-index: 1400;
        cursor: pointer;
      }
      .intro-in {
        text-align: center;
        animation: introIn 0.5s ease-out;
      }
      @keyframes introIn {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
      }
      .intro-in h1 {
        font-family: var(--disp);
        font-size: clamp(44px, 6vw, 72px);
        letter-spacing: 3px;
        text-shadow: 0 6px 40px #000;
      }
      .intro-in p {
        color: #cdd8e4;
        margin-top: 8px;
        font-size: 15px;
      }
      .intro-in .tags {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .intro-in .tags span {
        font-family: var(--mono);
        font-size: 11px;
        background: #ffffff14;
        border: 1px solid #ffffff2c;
        border-radius: 5px;
        padding: 4px 10px;
      }

      /* 面板 */
      .panel {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        z-index: 800;
        font-size: 12.5px;
        backdrop-filter: blur(10px);
      }
      .panel.top {
        top: 0;
      }
      .panel.bottom {
        bottom: 0;
      }
      .pbtn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: none;
        color: inherit;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        transition: background 0.13s;
      }
      .pbtn:hover {
        background: #ffffff1c;
      }
      .pbtn.act {
        background: #ffffff24;
      }
      .clock {
        font-family: var(--mono);
        white-space: nowrap;
      }
      .clock span {
        opacity: 0.75;
        margin-left: 6px;
        font-size: 11px;
      }
      .task {
        flex: 1;
        display: flex;
        gap: 4px;
        overflow: hidden;
        padding: 0 4px;
      }
      .task button {
        max-width: 170px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: #ffffff10;
        border: 1px solid transparent;
        color: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        transition: background 0.13s;
      }
      .task button:hover {
        background: #ffffff22;
      }
      .task button.act {
        background: #ffffff28;
        border-color: var(--acc);
      }
      .spacer {
        flex: 1;
      }
      .tray {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      /* 窗口 */
      .win {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: var(--winbg);
        color: var(--winfg);
        border-radius: var(--rad);
        box-shadow:
          0 14px 44px -8px #000a,
          0 0 0 1px #ffffff14;
        animation: winIn 0.17s ease-out;
        overflow: hidden;
        min-width: 260px;
      }
      @keyframes winIn {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
        }
      }
      .win.focused {
        box-shadow:
          0 22px 60px -10px #000c,
          0 0 0 2px var(--acc);
      }
      .tlb {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 10px;
        background: var(--tlb);
        color: var(--tlbfg);
        flex: none;
        cursor: grab;
        user-select: none;
      }
      .tlb:active {
        cursor: grabbing;
      }
      .tlb .tt {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12.5px;
        font-weight: 500;
      }
      .tlb .tico {
        font-size: 14px;
      }
      .wbtn {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: none;
        background: #ffffff22;
        color: inherit;
        font-size: 11px;
        line-height: 1;
        display: grid;
        place-items: center;
        transition: background 0.12s;
        flex: none;
      }
      .wbtn:hover {
        background: #ffffff44;
      }
      .wbtn.x:hover {
        background: #e0524a;
        color: #fff;
      }
      .wbody {
        flex: 1;
        overflow: auto;
        position: relative;
      }
      /* i3/sway 平铺条 */
      .tile-strip .tlb {
        height: 22px;
        font-family: var(--mono);
        font-size: 11px;
        border-radius: 0;
        background: #1c2127;
        color: #98a4b3;
        cursor: default;
      }
      .tile-strip.focused .tlb {
        background: var(--acc);
        color: #fff;
      }
      .tile-strip .wbtn {
        display: none;
      }

      /* 菜单 / 弹层 */
      .popup {
        position: absolute;
        z-index: 950;
        animation: popIn 0.16s ease-out;
        border-radius: 10px;
        box-shadow: 0 24px 70px -12px #000d;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
      }
      .menu {
        background: #101419f5;
        border: 1px solid #ffffff1e;
        backdrop-filter: blur(14px);
        color: #dde5ee;
        width: 380px;
      }
      .menu.light {
        background: #f2f4f7f8;
        color: #252c34;
        border-color: #00000022;
      }
      .m-search {
        margin: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #ffffff12;
        border: 1px solid #ffffff22;
        border-radius: 7px;
        padding: 7px 10px;
      }
      .menu.light .m-search {
        background: #0000000d;
        border-color: #00000022;
      }
      .m-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: inherit;
        font-size: 13px;
      }
      .m-cols {
        display: flex;
        min-height: 250px;
      }
      .m-cats {
        width: 120px;
        border-right: 1px solid #ffffff14;
        padding: 6px;
      }
      .menu.light .m-cats {
        border-color: #00000015;
      }
      .m-cats div {
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        color: #9fb0c2;
        cursor: default;
      }
      .m-cats div.on {
        background: #ffffff16;
        color: #fff;
      }
      .menu.light .m-cats div.on {
        background: #00000012;
        color: #111;
      }
      .m-apps {
        flex: 1;
        padding: 6px;
        max-height: 300px;
        overflow: auto;
      }
      .m-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: inherit;
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 13px;
        transition: background 0.12s;
      }
      .m-item:hover {
        background: #ffffff18;
      }
      .menu.light .m-item:hover {
        background: #00000010;
      }
      .m-item .mi {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #ffffff14;
        display: grid;
        place-items: center;
        font-size: 14px;
        flex: none;
      }
      .m-item small {
        margin-left: auto;
        color: #75879b;
        font-size: 10.5px;
        font-family: var(--mono);
      }
      .m-foot {
        border-top: 1px solid #ffffff16;
        padding: 6px;
        display: flex;
        justify-content: space-between;
      }
      .m-foot button {
        background: none;
        border: none;
        color: #9fb0c2;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .m-foot button:hover {
        background: #ffffff16;
        color: #fff;
      }
      .m-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 10px;
      }
      .m-grid button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        background: none;
        border: none;
        color: inherit;
        padding: 12px 6px;
        border-radius: 9px;
        font-size: 12px;
        transition:
          background 0.12s,
          transform 0.12s;
      }
      .m-grid button:hover {
        background: #ffffff16;
        transform: translateY(-2px);
      }
      .m-grid .gi {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(150deg, #ffffff22, #ffffff08);
        display: grid;
        place-items: center;
        font-size: 21px;
        box-shadow: inset 0 0 0 1px #ffffff1e;
      }

      /* 全屏 overlay */
      .ov {
        position: absolute;
        inset: 0;
        z-index: 900;
        animation: ovIn 0.18s ease-out;
      }
      @keyframes ovIn {
        from {
          opacity: 0;
        }
      }
      .gnome-ov {
        background: #0b0e14d8;
        backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 56px;
      }
      .ov-search {
        width: min(560px, 80%);
        display: flex;
        gap: 10px;
        align-items: center;
        background: #ffffff10;
        border: 1px solid #ffffff2a;
        border-radius: 10px;
        padding: 11px 16px;
        color: #fff;
      }
      .ov-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: #fff;
        font-size: 15px;
      }
      .clones {
        flex: 1;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 22px;
        justify-content: center;
        align-content: center;
        padding: 30px 120px;
      }
      .clone {
        width: 230px;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .clone:hover {
        transform: scale(1.05);
      }
      .clone .c-tlb {
        height: 26px;

          s.root.append(d);
        });
      }

      /* ============================================================ 窗口管理 */
      function focusWin(s, w) {
        s.wins.forEach((x) => x.classList.remove("focused"));
        w.classList.add("focused");
        w.style.zIndex = ++s.Z;
        s.focused = w;
        s.focusedIdx = s.wins.indexOf(w);
        updateTask(s);
      }
      function closeWin(s, w) {
        w.remove();
        s.wins = s.wins.filter((x) => x !== w);
        if (s.focused === w)
          s.focused =
            s.wins
              .filter((x) => x.dataset.ws == s.ws && !x.dataset.min)
              .pop() || null;
        if (s.cfg.tiling) layoutTiles(s);
        updateTask(s);
      }
      function spawn(s, appid) {
        const c = s.cfg;
        const names = {
          term: [c.apps.term, "🖥"],
          files: [c.apps.files, "🗂"],
          editor: [c.apps.editor, "📝"],
          man: ["Man 手册", "📖"],
          about: ["关于本机", "ℹ️"],
          welcome: ["欢迎", "👋"],
        }[appid];
        if (!names[0]) return;
        const w = el("section", "win" + (c.tiling ? " tile-strip" : ""));
        const sizes = {
          term: [600, 380],
          files: [560, 380],
          editor: [540, 380],
          man: [720, 470],
          about: [480, 420],
          welcome: [520, 420],
        }[appid];
        w.dataset.app = appid;
        w.dataset.ws = s.ws;
        w.dataset.title = names[0];
        const tlb = el("div", "tlb");
        const deco = c.tiling
          ? "strip"
          : c.id === "gnome" || c.id === "budgie" || c.id === "cosmic"
            ? "csd"
            : "classic";
        let titlePart;
        if (deco === "csd") {
          titlePart = el("div", "tt");
          titlePart.style.textAlign = "center";
          tlb.append(titlePart);
        } else if (deco === "strip") {
          titlePart = el("div", "tt");
          tlb.append(titlePart);
        } else {
          tlb.append(el("span", "tico", names[1]));
          titlePart = el("div", "tt");
          tlb.append(titlePart);
        }
        titlePart.textContent = names[0];
        if (deco !== "strip") {
          const wrap = el("div", "");
          wrap.style.display = "flex";
          wrap.style.gap = "6px";
          if (c.id !== "gnome") {
            const mn = el("button", "wbtn", "–");
            mn.title = "最小化";
            mn.onclick = (e) => {
              e.stopPropagation();
              w.dataset.min = "1";
              w.style.display = "none";
              updateTask(s);
            };
            wrap.append(mn);
          }
          const mx = el("button", "wbtn", "□");
          mx.title = "最大化";
          mx.onclick = (e) => {
            e.stopPropagation();
            toggleMax(s, w);
          };
          wrap.append(mx);
          const cl = el("button", "wbtn x", "✕");
          cl.title = "关闭";
          cl.onclick = (e) => {
            e.stopPropagation();
            closeWin(s, w);
          };
          wrap.append(cl);
          if (deco === "csd") {
            tlb.prepend(el("span", "tico", names[1]));
            tlb.append(wrap);
          } else tlb.append(wrap);
        }
        w.append(tlb);
        const body = el("div", "wbody");
        body.append(appContent(s, appid, w));
        w.append(body);
        if (appid === "term") body.style.background = "#0c0f14";
        s.work.append(w);
        // 尺寸与位置
        const W = s.work.clientWidth,
          H = s.work.clientHeight;
        w.style.width = Math.min(sizes[0], W - 60) + "px";
        w.style.height = Math.min(sizes[1], H - 50) + "px";
        const off = s.winSeq++ % 6;
        w.style.left = Math.max(16, 60 + off * 34) + "px";
        w.style.top = Math.max(10, 36 + off * 28) + "px";
        s.wins.push(w);
        tlb.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".wbtn")) return;
          focusWin(s, w);
          if (c.tiling && s.tilingOn) {
            if (c.id === "cosmic")
              toast(
                s,
                "平铺模式：窗口由布局器管理（Super+Y 关闭平铺可拖动）",
                2600,
              );
            return;
          }
          if (w.dataset.max) return;
          const sx = e.clientX - w.offsetLeft,
            sy = e.clientY - w.offsetTop;
          tlb.setPointerCapture(e.pointerId);
          const mv = (ev) => {
            w.style.left =
              Math.max(
                -w.offsetWidth + 80,
                Math.min(ev.clientX - sx, s.work.clientWidth - 80),
              ) + "px";
            w.style.top =
              Math.max(0, Math.min(ev.clientY - sy, s.work.clientHeight - 34)) +
              "px";
          };
          const up = () => {
            tlb.removeEventListener("pointermove", mv);
            tlb.removeEventListener("pointerup", up);
          };
          tlb.addEventListener("pointermove", mv);
          tlb.addEventListener("pointerup", up);
        });
        w.addEventListener("pointerdown", () => focusWin(s, w));
        focusWin(s, w);
        if (c.tiling && s.tilingOn) layoutTiles(s);
        if (c.id === "cosmic" && s.tilingOn) layoutTiles(s);
        return w;
      }
      function toggleMax(s, w) {
        if (w.dataset.max) {
          delete w.dataset.max;
          const r = JSON.parse(w.dataset.prev);
          Object.assign(w.style, r);
          w.dataset.max = "";
        } else {
          w.dataset.prev = JSON.stringify({
            left: w.style.left,
            top: w.style.top,
            width: w.style.width,
            height: w.style.height,
          });
          w.dataset.max = "1";
          w.style.left = "0";
          w.style.top = "0";
          w.style.width = "100%";
          w.style.height = "100%";
        }
      }
      function layoutTiles(s) {
        const wins = s.wins.filter(
          (w) => w.dataset.ws == s.ws && !w.dataset.min,
        );
        if (!wins.length) {
          s.titleFns.forEach((f) => f(null));
          return;
        }
        const W = s.work.clientWidth,
          H = s.work.clientHeight,
          g = s.cfg.gap || 8,
          p = 6;
        const rects = [];
        if (wins.length === 1) rects.push([p, p, W - 2 * p, H - 2 * p]);
        else if (wins.length === 2) {
          const hw = (W - 3 * p) / 2;
          rects.push([p, p, hw, H - 2 * p], [p * 2 + hw, p, hw, H - 2 * p]);
        } else {
          const mw = (W - 3 * p) * 0.52;
          rects.push([p, p, mw, H - 2 * p]);
          const n = wins.length - 1,
            rh = (H - p * (n + 1)) / n;
          for (let i = 0; i < n; i++)
            rects.push([p * 2 + mw, p + i * (rh + p), W - mw - p * 3, rh]);
        }
        wins.forEach((w, i) => {
          const [x, y, ww, hh] = rects[i];
          w.style.left = x + "px";
          w.style.top = y + "px";
          w.style.width = ww + "px";
          w.style.height = hh + "px";
        });
        if (!s.focused || !wins.includes(s.focused)) focusWin(s, wins[0]);
        updateTask(s);
      }
      function updateTask(s) {
        if (s.taskEl) {
          s.taskEl.innerHTML = "";
          s.wins
            .filter((w) => w.dataset.ws == s.ws)
            .forEach((w) => {
              const b = el(
                "button",
                w.classList.contains("focused") && !w.dataset.min ? "act" : "",
                `${w.dataset.title}`,
              );
              b.onclick = () => {
                if (w.dataset.min) {
                  delete w.dataset.min;
                  w.style.display = "";
                  focusWin(s, w);
                  if (s.cfg.tiling) layoutTiles(s);
                } else if (s.focused === w) {
                  w.dataset.min = "1";
                  w.style.display = "none";
                } else focusWin(s, w);
                updateTask(s);
              };
              s.taskEl.append(b);
            });
        }
        if (s.dock) {
          s.dock.innerHTML = "";
          ["term", "files", "editor", "man", "about"].forEach((app) => {
            if (!dockAppOk(s, app)) return;
            const ic = {
              term: "🖥",
              files: "🗂",
              editor: "📝",
              man: "📖",
              about: "ℹ️",
            }[app];
            const b = el("button", "");
            b.textContent = ic;
            b.style.cssText =
              "position:relative;width:44px;height:44px;border-radius:12px;border:none;background:#ffffff10;font-size:20px;transition:transform .13s,background .13s";
            b.onmouseenter = () => (b.style.background = "#ffffff24");
            b.onmouseleave = () => (b.style.background = "#ffffff10");
            b.onmouseenter2 = null;
            const running = s.wins.some((w) => w.dataset.app === app);
            if (running) {
              const d = el("span");
              d.style.cssText = `position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:${s.cfg.acc}`;
              b.append(d);
            }
            b.onclick = () => {
              const ex = s.wins.find(
                (w) =>
                  w.dataset.app === app &&
                  !w.dataset.min &&
                  w.dataset.ws == s.ws,
              );
              ex ? focusWin(s, ex) : spawn(s, app);
            };
            s.dock.append(b);
          });
          const lib = el("button", "", "⊞");
          lib.title = "应用库 (Super+A)";
          lib.style.cssText =
            "width:44px;height:44px;border-radius:12px;border:1px dashed #ffffff30;background:none;color:#cdd8e4;font-size:18px";
          lib.onclick = () => appLibrary(s);
          s.dock.append(lib);
        }
        s.titleFns.forEach((f) =>
          f(s.focused && !s.focused.dataset.min ? s.focused : null),
        );
        if (s.cfg.id === "i3" || s.cfg.id === "sway") paintI3ws(s);
      }
      function dockAppOk(s, app) {
        const c = s.cfg;
        return !!(
          app === "term" ||
          (app === "files" && c.apps.files) ||
          (app === "editor" && c.apps.editor) ||
          app === "man" ||
          app === "about"
        );
      }
      function setWS(s, n) {
        s.ws = n;
        if (s.cfg.tiling) layoutTiles(s);
        updateTask(s);
      }

      /* ============================================================ 菜单 */

        } else if (c.id === "plasma") {

          inp.oninput = () => {

            el("button", "", "📖 Man 手册"),

            spawn(s, "man");

          ft.children[1].onclick = logout;
          m.append(ft);
          if (c.id === "budgie") {
            const inp = $("input", m);
            if (inp)
              inp.oninput = () => {
                const q = inp.value.toLowerCase();

                  (b, i) =>

      function menuApps(s) {
        const c = s.cfg,
          a = [];
        if (c.apps.term) a.push(["term", "🖥", c.apps.term, "terminal"]);
        if (c.apps.files) a.push(["files", "🗂", c.apps.files, "files"]);

      function mountPopup(s, node, r, alignLeft) {
        const pop = el("div", "popup");
        pop.append(node);

          ph = node.offsetHeight || 300;

      <p style="color:#9fb0c2">${c.desc}</p><h4>设计哲学</h4><p>${c.phil}</p>
      <h4>快速上手</h4><ul style="margin-left:18px">${c.tips.map((t) => `<li>${t}</li>`).join("")}</ul>
      <h4>延伸阅读</h4><p>打开「Man 手册」应用，或在终端输入 <kbd>man ${MAN[c.id].name.replace(/\(\d\)/, "")}</kbd></p>`,
          );
          d.append(bar, doc);
        };
        const bar0 = d.firstChild;
        return d;
      }
      function editorApp(s) {
        const d = el("div", "editor");
        d.style.height = "100%";
        const ta = el("textarea");
        ta.value = `# ${s.cfg.name} 体验笔记\n# ${new Date().toLocaleString()}\n\n- 这个桌面最让我意外的一点：\n\n- 和 GNOME / KDE 相比：\n\n- 我会不会日常使用它？为什么？\n`;
        d.append(ta);
        return d;
      }
      function aboutApp(s) {
        const c = s.cfg;
        const d = el("div", "about");
        d.innerHTML = `<h4 style="color:${c.acc}">${c.name}</h4><div class="sub">${c.cn}</div>
  <dl>${c.stack.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
  <p><b style="color:#8fc7ff">设计哲学</b><br>${c.phil}</p>`;
        return d;
      }

      /* ============================================================ 全局键盘 */
      const t0 = Date.now();
      document.addEventListener(
        "keydown",
        (e) => {
          if (!cur) return;
          const s = cur,
            c = s.cfg,
            k = e.key.toLowerCase();
          if (e.key === "Escape") {
            closePopups(s);
            return;
          }
          if (e.key === "?" || e.key === "F1") {
            e.preventDefault();
            helpOverlay(s);
            return;
          }
          // i3 / sway：Mod = Alt
          if ((c.id === "i3" || c.id === "sway") && e.altKey && !e.ctrlKey) {
            e.preventDefault();
            const vis = () =>
              s.wins.filter((w) => w.dataset.ws == s.ws && !w.dataset.min);
            const move = (dir) => {
              const ws = vis();
              if (!ws.length) return;
              const order = {
                h: [...ws].sort((a, b) => a.offsetLeft - b.offsetLeft),
                v: [...ws].sort((a, b) => a.offsetTop - b.offsetTop),
              };
              const cur0 = s.focused;
              let arr;
              if (dir === "h" || dir === "l") arr = order.h;
              else if (dir === "j") arr = order.v;
              else if (dir === "k") arr = [...order.v].reverse();
              else arr = [...order.h].reverse();
              const i = arr.indexOf(cur0);
              const nxt = arr[(i + 1 + arr.length) % arr.length] || arr[0];
              focusWin(s, nxt);
            };
            const send = (dir) => {
              const ws = vis();
              if (!s.focused || !ws.includes(s.focused)) return;
              const arr =
                dir === "h" || dir === "l"
                  ? ws.sort((a, b) => a.offsetLeft - b.offsetLeft)
                  : ws.sort((a, b) => a.offsetTop - b.offsetTop);
              const i = arr.indexOf(s.focused);
              const o = arr[(i + 1) % arr.length];
              if (o && o !== s.focused) {
                const tp = {
                  left: s.focused.style.left,
                  top: s.focused.style.top,
                };
                s.focused.style.left = o.style.left;
                s.focused.style.top = o.style.top;
                o.style.left = tp.left;
                o.style.top = tp.top;
                layoutTiles(s);
              }
            };
            switch (k) {
              case "enter":
                spawn(s, "term");
                break;
              case "d":
                dmenuBar(s, c.id === "i3" ? "i3" : "wofi");
                break;
              case "q":
                if (e.shiftKey && s.focused) closeWin(s, s.focused);
                break;
              case "h":
              case "arrowleft":
                e.shiftKey ? send("h") : move("h");
                break;
              case "l":
              case "arrowright":
                e.shiftKey ? send("l") : move("l");
                break;
              case "j":
              case "arrowdown":
                e.shiftKey ? send("j") : move("j");
                break;
              case "k":
              case "arrowup":
                e.shiftKey ? send("k") : move("k");
                break;
              case "f":
                if (s.focused) toggleMax(s, s.focused);
                break;
              case "e":
                if (e.shiftKey) exitDialog(s);
                break;
              case "1":
              case "2":
              case "3":
              case "4":
                if (e.shiftKey && s.focused) {
                  s.focused.dataset.ws = +k;
                  setWS(s, +k);
                  toast(s, `窗口已移至工作区 ${k}`);
                } else setWS(s, +k);
                break;
            }
            return;
          }
          // COSMIC：Super 组合
          if (c.id === "cosmic" && e.metaKey) {
            s.metaUsed = true;
            if (k === "/") {
              e.preventDefault();
              cosmicLauncher(s);
            } else if (k === "t") {
              e.preventDefault();
              spawn(s, "term");
            } else if (k === "y") {
              e.preventDefault();
              toggleCosmicTiling(s);
            } else if (k === "a") {
              e.preventDefault();
              appLibrary(s);
            } else if (["1", "2", "3", "4"].includes(k)) {
              e.preventDefault();
              setWS(s, +k);
            }
            return;
          }
          if (c.id === "cosmic" && e.key === "Meta" && !e.repeat) {
            s.metaDown = true;
            s.metaUsed = false;
            return;
          }
          // GNOME：Super 单击 = 概览
          if (e.key === "Meta" && !e.repeat) {
            s.metaDown = true;
            s.metaUsed = false;
            if (c.id === "gnome") {
              /* handled on keyup */
            }
            return;
          }
          if (c.id === "gnome" && e.metaKey) {
            s.metaUsed = true;
            if (k === "a") {
              e.preventDefault();
              appLibrary(s);
            } else if (k === "arrowleft" && s.focused) {
              e.preventDefault();
              half(s.focused, "l");
            } else if (k === "arrowright" && s.focused) {
              e.preventDefault();
              half(s.focused, "r");
            } else if (k === "arrowup" && s.focused) {
              e.preventDefault();
              toggleMax(s, s.focused);
            }
            return;
          }
          // Budgie: Super+N → Raven
          if (c.id === "budgie" && e.metaKey && k === "n") {
            s.metaUsed = true;
            e.preventDefault();
            toggleRaven(s);
            return;
          }
        },
        true,
      );
      document.addEventListener("keyup", (e) => {
        if (!cur) return;
        const s = cur;
        if (e.key === "Meta" && s.metaDown && !s.metaUsed) {
          if (s.cfg.id === "gnome") openOverview(s);
          else if (s.cfg.id === "cinnamon") {
            const lb = $(".pbtn", s.root);
            lb && openMenu(s, lb);
          } else if (s.cfg.id === "budgie") {
            const lb = $(".pbtn", s.root);
            lb && openMenu(s, lb);
          } else if (s.cfg.id === "cosmic") cosmicLauncher(s);
        }
        if (e.key === "Meta") s.metaDown = false;
      });
      function half(w, side) {
        w.dataset.max = "";
        w.style.top = "0";
        w.style.height = "100%";
        w.style.width = "50%";
        w.style.left = side === "l" ? "0" : "50%";
      }

      /* DM 时钟 */
      setInterval(() => {
        const d = new Date();
        const bc = $("#bigClock");
        if (!bc) return;
        bc.textContent = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
        $("#bigSec").textContent = ":" + p2(d.getSeconds());
        $("#bigDate").textContent =
          `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 星期${WK[d.getDay()]}`;
        $("#dmClock").textContent = d.toLocaleTimeString();
      }, 500);

      buildDM();
    </script>
  </body>
</html>
